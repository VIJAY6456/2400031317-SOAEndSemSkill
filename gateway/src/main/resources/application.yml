server:
  port: 9090

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:9091
          predicates:
            - Path=/auth/**
        - id: book-service
          uri: http://localhost:9092
          predicates:
            - Path=/books/**
        - id: order-service
          uri: http://localhost:9093
          predicates:
            - Path=/orders/**

jwt:
  secret: KLU-microservices-shared-jwt-secret-key-for-signing-tokens-2026
  expiration-ms: 3600000
